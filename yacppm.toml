[dependencies.barkeep]
git = 'https://github.com/oir/barkeep.git'
type = 'header'
version = 'latest'

[dependencies.fmt]
git = 'https://github.com/fmtlib/fmt.git'
type = 'cmake'
version = '12.1.0'

[dependencies.libgit2]
git = 'https://github.com/libgit2/libgit2.git'
type = 'cmake'
version = 'v1.9.2'
# settings = { linking = 'static' }

[dependencies.tomlplusplus]
git = 'https://github.com/marzer/tomlplusplus.git'
type = 'header'
version = 'v3.4.0'

[package]
name = 'yacppm'
type = 'exec'
version = '0.1.9'

    [package.settings]
    cpp = '20'

[target.windows]
cross_libs = [ 'ws2_32', 'winhttp', 'rpcrt4', 'crypt32' ]

[target.windows_x86_64]
cross_libs_path = [ '/usr/x86_64-w64-mingw32/lib/' ]

[target.windows_i686]
cross_libs_path = [ '/usr/i386-w64-mingw32/lib/' ]
